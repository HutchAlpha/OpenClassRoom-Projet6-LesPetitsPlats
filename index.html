<!DOCTYPE html>
<html lang="fr">
<head>
  <title>Les Petits Plats</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="m-0 p-0 box-border">
  <header
    class="relative h-screen bg-cover bg-center flex flex-col items-center justify-center text-white"
    style="background-image: url('img/PresentationMain.png');"
  >
    <!-- Logo -->
    <div class="absolute top-6 left-6">
      <img src="img/Logo.svg" alt="Logo officiel de Les petits plats" class="h-8" />
    </div>

    <!-- Contenu centré -->
    <div class="text-center px-4 max-w-3xl">
      <h1 class="text-yellow-400 text-2xl sm:text-4xl md:text-5xl font-bold police-Anton leading-tight uppercase mb-10">
        Cherchez parmi plus de 1500 recettes du quotidien,<br />
        simples et délicieuses
      </h1>

      <!-- Barre de recherche -->
      <div class="flex w-full max-w-xl mx-auto rounded-full overflow-hidden shadow-md bg-white">
        <input
          type="text"
          id="RechercheInput"
          placeholder="Rechercher une recette, un ingrédient, ..."
          class="flex-grow px-6 py-3 text-gray-800 outline-none"
        />
        <button id="RechercheBtn" class="px-5 flex items-center justify-center">
          <img src="img/recherche.svg" alt="Rechercher" class="w-10 h-10" />
        </button>
      </div>
    </div>
  </header>


  <section class="bg-gray-200 py-6 px-8">
    <div class="max-w-6xl mx-auto flex items-center gap-12">

      <!--FILTRE INGRÉDIENTS-->
    <div class="relative inline-block w-36 sm:w-40 md:w-44">
      <button
        class="w-full px-3 py-2 text-left bg-white border border-gray-300 rounded-md shadow-sm flex justify-between items-center"
        id="BoutonFiltreIngredients"
      >
        <span class="text-sm">Ingrédients</span>
        <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <div id="dropdownIngredients" class="hidden absolute z-10 w-full mt-1 bg-white border border-gray-200 rounded-md shadow-lg">
        <div class="flex items-center px-2 py-2 border-b">
          <input
            type="text"
            placeholder="Rechercher..."
            class="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:outline-none focus:ring"
            id="searchFiltreIngredients"
          />
          <svg class="w-4 h-4 ml-2 text-gray-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M21 21l-6-6m2-5a7 7 0 1 0-14 0 7 7 0 0 0 14 0z" />
          </svg>
        </div>
        <ul id="ingredientList" class="max-h-60 overflow-y-auto text-sm p-1 space-y-1"></ul>
      </div>
    </div>


      <!-- FILTRE APPAREILS (exactement ton HTML) -->
        <div class="relative inline-block w-36 sm:w-40 md:w-44">
      <button
        class="w-full px-3 py-2 text-left bg-white border border-gray-300 rounded-md shadow-sm flex justify-between items-center"
        id="BoutonFiltreAppareils"
      >
        <span class="text-sm">Appareils</span>
        <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <div id="dropdownAppareils" class="hidden absolute z-10 w-full mt-1 bg-white border border-gray-200 rounded-md shadow-lg">
        <div class="flex items-center px-2 py-2 border-b">
          <input
            type="text"
            placeholder="Rechercher..."
            class="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:outline-none focus:ring"
            id="searchFiltreAppareils"
          />
          <svg class="w-4 h-4 ml-2 text-gray-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M21 21l-6-6m2-5a7 7 0 1 0-14 0 7 7 0 0 0 14 0z" />
          </svg>
        </div>
        <ul id="appareilsList" class="max-h-60 overflow-y-auto text-sm p-1 space-y-1"></ul>
      </div>
    </div>

      <!-- FILTRE USTENSILES (exactement ton HTML) -->
 <div class="relative inline-block w-36 sm:w-40 md:w-44">
      <button
        class="w-full px-3 py-2 text-left bg-white border border-gray-300 rounded-md shadow-sm flex justify-between items-center"
        id="BoutonFiltreUstensiles"
      >
        <span class="text-sm">Ustensiles</span>
        <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <div id="dropdownUstensiles" class="hidden absolute z-10 w-full mt-1 bg-white border border-gray-200 rounded-md shadow-lg">
        <div class="flex items-center px-2 py-2 border-b">
          <input
            type="text"
            placeholder="Rechercher..."
            class="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:outline-none focus:ring"
            id="searchFiltreUstensiles"
          />
          <svg class="w-4 h-4 ml-2 text-gray-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M21 21l-6-6m2-5a7 7 0 1 0-14 0 7 7 0 0 0 14 0z" />
          </svg>
        </div>
        <ul id="ustensilesList" class="max-h-60 overflow-y-auto text-sm p-1 space-y-1"></ul>
      </div>
    </div>
      <div class="flex-1"></div>

      <!-- Nombre de recettes (à droite) -->
      <div id="NombreRecettes" class="text-gray-900 font-bold uppercase"></div>
    </div>
  </section>

<section id="recetteSection" class="flex flex-row flex-wrap justify-center gap-4 bg-red-100 p-4"></section>


</html>
    <script src="recipes.js"></script>
    <script src="src/main.js"></script>
